[project]
name = "plant-leaf-classification"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "royerbruna", email = "royer.machado@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
plant-leaf-classification = "plant_leaf_classification:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
